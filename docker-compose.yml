
version: '3'
services:
  jupyter:
      container_name: instacart-jupyter
      image: jupyter/pyspark-notebook
      ports:
        - "8889:8888"
        - "4040:4040"
      volumes:
        - .:/home/jovyan/instacart-reorder-prediction
        - E:/Personal-Project/data/raw:/home/jovyan/data
  
  zookeeper:
      container_name: instacart-zookeeper
      image: confluentinc/cp-zookeeper:7.3.0
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000

  kafka:
      container_name: instacart-kafka
      image: confluentinc/cp-kafka:7.3.0
      depends_on:
        - zookeeper
      ports:
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  
  redis:
    container_name: instacart-redis
    image: redis:latest
    ports:
      - "6379:6379"
  
  mongodb:
    container_name: instacart-mongodb
    image: mongo:latest
    ports:
      - "27017:27017"